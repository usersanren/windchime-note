[package]
name = "desktop-note-widget"
version = "1.0.0"
description = "Wind Chime Note - a hanging desktop quote widget"
authors = ["desktop-note-widget"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "desktop_note_widget_lib"
# 桌面端只需 rlib；去掉 staticlib 可省下约 200MB 中间产物
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# AI 短句在线生成：桌面端由 Rust 侧发起请求，规避 WebView CORS
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
